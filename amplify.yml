version: 1

backend:
  phases:
    preBuild:
      commands:
        - cd frontend && yarn install --frozen-lockfile
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
      - /root/.cache/yarn/**/*
